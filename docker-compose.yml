services:
  mariadb:
    image: mariadb:11
    container_name: mariadb
    environment: 
      # to move to .env
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
    - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
  
  python_pipeline:
    build: 
      context: .
      dockerfile: pipeline/Dockerfile
    env_file:
      - .env
    container_name: pipeline
    depends_on: 
      - mariadb
    command: ["python", "/pipeline/src/main.py"]

volumes:
  mariadb_data: